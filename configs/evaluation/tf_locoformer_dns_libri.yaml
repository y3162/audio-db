# Published TF-Locoformer DNS checkpoint on the complete libri_demand_snr0 set.
# Two LibriSpeech test-clean utterances mixed with DEMAND at 0 dB.
# This is an evaluation of the released enhancer, not a checkpoint trained here.
# Whisper large-v3, task transcribe, language en, temperature 0.
# WER is wer-norm-v1. PESQ and STOI use the clean reference.

experiment:
  name: tf-locoformer-dns-libri-snr0
  seed: 17

dataset:
  source: duckdb
  path: data/db/resource.duckdb
  corpora_root: data/corpora
  set: libri_demand_snr0

mixing:
  enabled: false

models:
  - name: tf_locoformer
    variant: dns
    checkpoint: data/checkpoints/tf-locoformer/dns/valid.loss.ave_5best.pth

asr:
  enabled: true
  name: whisper
  model_id: large-v3
  device: cuda
  language: en
  conditions: [clean, noisy, enhanced]

metrics:
  wer: true
  normalization: wer-norm-v1
  pesq: true
  stoi: true
  si_sdr: true

output:
  root: data/results/se-evaluation
  run_id: tf-locoformer-dns-libri-snr0-20261105
  save_audio: false
  resume: false

runtime:
  device: cuda
  allow_busy_gpu: false
