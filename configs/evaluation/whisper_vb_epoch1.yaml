# Same four VoiceBank-DEMAND test utterances as whisper_vb_smoke.yaml.
# Enhancer is the TF-GridNet checkpoint after 5000 updates, seed 17.
# This is one published-length epoch, not a finished 35-epoch model.

experiment:
  name: whisper-large-v3-vb4-epoch1
  seed: 17
  limit: 4

dataset:
  source: duckdb
  path: data/db/resource.duckdb
  corpora_root: data/corpora
  set: voicebank_demand_test

mixing:
  enabled: false

models:
  - name: tf_gridnet
    variant: ms-snsd
    checkpoint: data/results/training/tf-gridnet-seed17-epoch1-20261104/generator.pt
    config:
      n_fft: 512
      stride: 256
      n_layers: 4
      lstm_hidden_units: 128
      attn_n_head: 4
      attn_approx_qk_dim: 512
      emb_dim: 32
      emb_ks: 4
      emb_hs: 4
      activation: prelu
      eps: 1.0e-5

asr:
  enabled: true
  name: whisper
  model_id: large-v3
  device: cuda
  language: en
  conditions: [clean, noisy, enhanced]

metrics:
  wer: true
  normalization: wer-norm-v1
  pesq: true
  stoi: true
  si_sdr: true

output:
  root: data/results/se-evaluation
  run_id: whisper-vb4-epoch1-20261104
  save_audio: false
  resume: false

runtime:
  device: cuda
  allow_busy_gpu: true
