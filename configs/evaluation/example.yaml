# Named set from `make db-init` (LibriSpeech test-clean + DEMAND, SNR 0 dB).
# rms_v1 is not the VoiceBank-DEMAND or URGENT mixture procedure.
# The case stores the clean prefix, noise crop, and seed. Leave mixing disabled.
experiment:
  name: se-example
  seed: 0
  limit: 2

dataset:
  source: duckdb
  path: data/db/resource.duckdb
  corpora_root: data/corpora
  set: libri_demand_snr0

mixing:
  enabled: false

models:
  - name: mp_senet
    variant: vb
    checkpoint: data/checkpoints/mp-senet/g_best_vb

asr:
  enabled: false

metrics:
  wer: false
  pesq: true
  stoi: true

output:
  root: data/results/se-evaluation
  save_audio: false
  resume: false

runtime:
  device: cpu
  allow_busy_gpu: false
