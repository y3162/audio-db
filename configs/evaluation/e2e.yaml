# One real SE model and one real ASR model on the named LibriSpeech/DEMAND set.
# This is a connection check. It is not a Clean / Noisy / Enhanced comparison.
experiment:
  name: se-asr-e2e
  seed: 0
  limit: 1

dataset:
  source: duckdb
  path: data/db/resource.duckdb
  corpora_root: data/corpora
  set: libri_demand_snr0

mixing:
  enabled: false

models:
  - name: mp_senet
    variant: vb
    checkpoint: data/checkpoints/mp-senet/g_best_vb

asr:
  enabled: true
  name: parakeet
  model_id: nvidia/parakeet-tdt-0.6b-v2
  device: cuda:1
  language: en

metrics:
  wer: true
  pesq: true
  stoi: true

output:
  root: data/results/se-evaluation
  save_audio: false
  resume: false

runtime:
  device: cpu
  allow_busy_gpu: false
