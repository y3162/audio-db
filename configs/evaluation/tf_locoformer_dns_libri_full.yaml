# Published TF-Locoformer DNS checkpoint on libri_testclean_full_smoke.
# Eight full-length LibriSpeech test-clean utterances. WER is defined here
# because the audio is not truncated. libri_demand_snr0 is partial audio and
# its WER stays na. Whisper large-v3, language en, temperature 0.

experiment:
  name: tf-locoformer-dns-libri-full
  seed: 17

dataset:
  source: duckdb
  path: data/db/resource.duckdb
  corpora_root: data/corpora
  set: libri_testclean_full_smoke

mixing:
  enabled: false

models:
  - name: tf_locoformer
    variant: dns
    checkpoint: data/checkpoints/tf-locoformer/dns/valid.loss.ave_5best.pth

asr:
  enabled: true
  name: whisper
  model_id: large-v3
  device: cuda
  language: en
  conditions: [clean, noisy, enhanced]

metrics:
  wer: true
  normalization: wer-norm-v1
  pesq: true
  stoi: true
  si_sdr: true

output:
  root: data/results/se-evaluation
  run_id: tf-locoformer-dns-libri-full-20261105
  save_audio: false
  resume: false

runtime:
  device: cuda
  allow_busy_gpu: false
