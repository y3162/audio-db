# Explicit inputs for `make db-init`.
# Optional entries are skipped, with a message, when the files or rows are absent.
# Required entries fail the command instead of being ignored.
database: data/db/resource.duckdb
corpora_root: data/corpora

manifests:
  - path: examples/manifests/example.jsonl
    set: example
    required: false
    description: Example manifest. Skipped when its audio files are not present.

corpus_sets:
  - name: libri_demand_snr0
    required: false
    description: Two LibriSpeech test-clean utterances mixed with DEMAND at 0 dB.
    role: synthetic
    filters:
      corpus: LibriSpeech
      subset: test-clean
    limit: 2
    noise_filters:
      corpus: DEMAND
    noise_limit: 1
    snr_db: 0
    seed: 0
    protocol: rms_v1
    max_seconds: 2.0
    prevent_clip: true
    hard_clip: false
  - name: libri_testclean_full_smoke
    required: false
    description: >
      Eight LibriSpeech test-clean utterances at full length, ordered by path.
      No noise mix and no max_seconds crop. Transcripts come from the corpus rows.
    role: clean
    filters:
      corpus: LibriSpeech
      subset: test-clean
    limit: 8

annotation_sets:
  - importer: chime3
    set: chime3_et05_real_ch5
    required: false
    split: et05
    condition: real
    channel: CH5
    description: >
      CHiME3 et05 real, tablet channel 5. Official JSON prompt is the transcript.
      This channel is not a clean reference, so PESQ and STOI are not defined here.
  - importer: chime3
    set: chime3_et05_real_ch0
    required: false
    split: et05
    condition: real
    channel: CH0
    description: >
      CHiME3 et05 real, close-talk channel 0. Recorded in the same noise as the
      tablet channels. It is not a clean reference.
  - importer: chime3
    set: chime3_et05_simu_ch5
    required: false
    split: et05
    condition: simu
    channel: CH5
    description: >
      CHiME3 et05 simulated noisy speech, tablet channel 5. The original WSJ
      waveform is not paired here.
  - importer: chime3
    set: chime3_tr05_org
    required: false
    split: tr05
    condition: org
    description: >
      CHiME3 original training material. Clean speech with official prompts.
      Not a time-aligned reference for the real noisy recordings.
  - importer: mp_senet_voicebank
    set: voicebank_demand_test
    required: false
    path: configs/db/lists/voicebank_demand_test.txt
    clean_dir: data/corpora/VoiceBank-DEMAND/wavs_clean
    noisy_dir: data/corpora/VoiceBank-DEMAND/wavs_noisy
    split: test
    description: >
      MP-SENet VoiceBank-DEMAND test ids. The list is MIT-licensed.
      See configs/db/lists/VOICEBANK_DEMAND_NOTICE.md. Registered only when
      both wav directories contain the listed files. The list has no transcript or SNR.
