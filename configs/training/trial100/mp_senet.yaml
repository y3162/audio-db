# 100-step trial. Official MP-SENet config.json at 89932cfe: batch 4,
# segment 32000, 16 kHz, AdamW 5e-4, betas 0.8/0.99, weight decay 0.01,
# ExponentialLR 0.99 once per finished epoch. Official default is 400 epochs.
# This file is not the long run. deterministic is off so step time matches
# the trainer path intended for full training (cuDNN benchmark stays off).

seed: 17
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 4
max_steps: 100
segment_size: 32000
loss: official
checkpoint_dir: data/results/training/trial100-20261104/mp_senet
checkpoint_interval: 50
validation_interval: 0
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.8, 0.99]
  weight_decay: 0.01

scheduler:
  name: exponential
  gamma: 0.99

model:
  name: mp_senet
  dense_channel: 64
  num_tsconformers: 4
  n_fft: 400
  hop_size: 100
  win_size: 400
  compress_factor: 0.3
  beta: 2.0
  sampling_rate: 16000

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid

runtime:
  device: cuda
  allow_busy_gpu: false
