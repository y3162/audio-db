# 100-step trial. Shipped DeepFilterNet3 width (DFN3Params defaults):
# 48 kHz, 3 s, AdamW 1e-3, betas 0.9/0.999, weight decay 1e-12, amsgrad,
# gradient clip 1, per-step cosine. Epoch-0 batch in the recorded schedule
# 0/16,2/24,5/32,10/64,20/128,40/9999 is 16. steps_per_epoch is
# floor(10700/16)=668 so these 100 steps stay on the real warmup curve.
# Epoch count is not re-read from config.ini here. The code default is 10.
# The released weight file is named model_120.

seed: 17
deterministic: false
global_batch_size: 16
micro_batch_size_per_gpu: 16
max_steps: 100
segment_size: 144000
loss: official
grad_clip: 1.0
checkpoint_dir: data/results/training/trial100-20261104/deepfilternet3
checkpoint_interval: 50
validation_interval: 0
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 1.0e-12
  amsgrad: true

scheduler:
  name: deepfilter_cosine
  steps_per_epoch: 668
  epochs: 120
  lr_min: 1.0e-6
  lr_warmup: 1.0e-4
  warmup_epochs: 3
  weight_decay_end: 0.01

model:
  name: deepfilternet3
  sampling_rate: 48000
  architecture: {}

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: false
