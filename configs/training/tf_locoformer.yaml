# TF-Locoformer DNS smoke. Two CPU updates, 1 second, batch 1.
# This is not the VoiceBank research run
# (configs/training/tf_locoformer_voicebank.yaml) and not the DNS recipe.
# loss official is mr_l1_tfd (windows 256/512/768/1024, time-domain weight 0.5).
# Variance normalization is inside the network, before the STFT, and is not
# inside the loss. data.rms_normalize is explicit: the shared loader default
# is true, while the DNS recipe leaves speech_volume_normalize unset.
# Published optimizer: AdamW, lr 1e-3, weight decay 1e-2, grad clip 5.
# Initialization here is PyTorch's module default. The research file uses
# ESPnet xavier_uniform.

seed: 1234
deterministic: true
global_batch_size: 1
micro_batch_size_per_gpu: 1
max_steps: 2
segment_size: 16000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/tf-locoformer
checkpoint_interval: 0
validation_interval: 0
best_checkpoint_start_epoch: 0

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: tf_locoformer
  variant: dns
  sampling_rate: 16000
  architecture: {}
  stft: {}

data:
  database: data/db/training.duckdb
  train_set: libri_demand_smoke_train
  validation_set: libri_demand_smoke_valid
  load_workers: 4
  prefetch: true
  rms_normalize: true

runtime:
  device: cpu
  allow_busy_gpu: false
