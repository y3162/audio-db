# Research full run, seed 17. Same update as configs/training/trial100/mossformergan.yaml.
# Global batch 2 is micro 1 times accumulation 2. 5,350 optimizer steps per epoch,
# 120 epochs. The task keeps its own plateau counter in the checkpoint.
# Validation PESQ is not computed; the interval checkpoint is the resume point.
# Utterance RMS stays on.

seed: 17
deterministic: false
global_batch_size: 2
micro_batch_size_per_gpu: 1
max_steps: 642000
segment_size: 32000
loss: official
grad_clip: 10.0
checkpoint_dir: data/results/training/mossformergan-seed17
checkpoint_interval: 5350
validation_interval: 5350
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: false
