# Batch-24 timing only. This is not the adopted training batch.
# The shipped schedule uses batch 24 at epochs 2-4
# (batch_size_scheduling 0/16,2/24,5/32,10/64,20/128,40/9999).
# steps_per_epoch is floor(10700/24)=445 so a later epoch's cosine
# would use that count. This file still starts at step 0; the step
# time is the batch-24 forward and backward, not epoch-2 wall time.

seed: 17
deterministic: false
global_batch_size: 24
micro_batch_size_per_gpu: 24
max_steps: 40
segment_size: 144000
loss: official
grad_clip: 1.0
checkpoint_dir: data/results/training/perf-fast-20261104/deepfilternet3-batch24
checkpoint_interval: 0
validation_interval: 0
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 1.0e-12
  amsgrad: true

scheduler:
  name: deepfilter_cosine
  steps_per_epoch: 445
  epochs: 120
  lr_min: 1.0e-6
  lr_warmup: 1.0e-4
  warmup_epochs: 3
  weight_decay_end: 0.01

model:
  name: deepfilternet3
  sampling_rate: 48000
  architecture: {}

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: false
