# Shared VoiceBank-DEMAND research run for TF-Locoformer dns (seed 42).
# Not the 2-step smoke in configs/training/tf_locoformer.yaml.
# Not a reproduction of the DNS-Interspeech 2020 corpus. The published DNS
# recipe subsamples 1000 utterances per epoch from DNS and does not apply an
# extra utterance RMS. This file uses voicebank_28_train / voicebank_28_valid
# (10,700 / 872) and explicit utterance RMS, matching the other research
# configs. The network, loss, AdamW, gradient clip, Xavier init, and warmup
# plateau match the published DNS recipe. DNS uses 64,000-sample chunks.
# At 16 kHz only 1,205 of 10,700 voicebank_28_train utterances are longer
# than 64,000 samples, so that chunk would drop the rest. This file uses
# 32,000 samples, which keeps utterances longer than 2 seconds (9,321 of
# 10,700). Global batch 4 is one forward batch, with no gradient
# accumulation. Measured memory is in docs/training/TF_LOCOFORMER.md.
# num_samples_per_epoch is the number of source utterances, not optimizer
# steps. max_steps is a safety cap. Do not start the 150-epoch run from
# this file alone.

seed: 42
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 4
max_steps: 2000000
segment_size: 32000
loss: official
grad_clip: 5.0
checkpoint_dir: ./data/results/training/voicebank-seed42/tf_locoformer
checkpoint_interval: 0
validation_interval: 0
best_checkpoint_start_epoch: 0

chunk_iterator:
  num_samples_per_epoch: 10700
  chunk_length: 32000
  chunk_shift_ratio: 0.5
  num_cache_chunks: 1024
  shuffle: true
  max_epochs: 150
  early_stopping_patience: 10
  keep_nbest: 5

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: warmup_reduce_on_plateau
  warmup_steps: 4000
  mode: min
  factor: 0.5
  patience: 3

model:
  name: tf_locoformer
  variant: dns
  init: xavier_uniform
  sampling_rate: 16000
  architecture: {}
  stft: {}

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true
  rms_normalize: true

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
