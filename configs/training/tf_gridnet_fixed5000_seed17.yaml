# Research schedule: fixed 5000 updates, not ESPnet chunk iterator epochs.
# Utterance RMS stays on (dataset default) so this run matches the shared
# VoiceBank preprocessing used by the other research models. The official
# chunk config turns that scale off. Do not resume the earlier 5000-step checkpoint.
seed: 17
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 4
max_steps: 175000
logical_steps_per_epoch: 5000
segment_size: 48000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/tf-gridnet-fixed-5000-seed17
checkpoint_interval: 5000
validation_interval: 5000
best_checkpoint_start_epoch: 0

optimizer:
  name: adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0

scheduler:
  name: plateau
  factor: 0.7
  patience: 1

model:
  name: tf_gridnet
  variant: ms-snsd
  sampling_rate: 16000
  architecture:
    n_fft: 512
    stride: 256
    n_layers: 4
    lstm_hidden_units: 128
    attn_n_head: 4
    attn_approx_qk_dim: 512
    emb_dim: 32
    emb_ks: 4
    emb_hs: 4
    activation: prelu
    eps: 1.0e-5
  stft: {}

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: true
