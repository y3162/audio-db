# Research full run, seed 17, on the shared VoiceBank-DEMAND split.
# Official config.yaml is one forward of batch 8. This H100 MIG 4g.47gb
# allocated 45.56 GiB and OOMed in the discriminator at 3 s.
# Research setting: micro 4 x accumulation 2, global batch 8.
# On fused CUDA at length 8000, batch 8 self-rerun audio max abs was 0.
# Accumulation differed by audio max abs 0.001338273286819458, generator-grad
# relative L2 0.02822, weight relative L2 2.01e-4. Grad norms stayed ~16.0,
# so the accumulation divisor is in place. The gap is the fused kernel's
# batch shape. This file does not claim one-forward batch 8.
# 10,700 / 4 = 2,675 micro-batches, and accumulation 2 keeps 2,674, so one
# epoch is 1,337 optimizer steps. 100 epochs. Official saves on an interval,
# not a PESQ-best file; this trainer also skips best_generator for SEMamba++.
# Utterance RMS stays on. Fused scan is the CUDA training path.

seed: 17
deterministic: false
global_batch_size: 8
micro_batch_size_per_gpu: 4
max_steps: 133700
segment_size: 48000
loss: official
checkpoint_dir: data/results/training/semambapp-seed17
checkpoint_interval: 1337
validation_interval: 1337
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0002
  betas: [0.8, 0.99]
  weight_decay: 0.01

scheduler:
  name: exponential
  gamma: 0.99

model:
  name: semambapp
  sampling_rate: 16000
  architecture:
    hid_feature: 48
    num_tfmamba: 4
    d_state: 16
    d_conv: 4
    expand: 2
    norm_epsilon: 1.0e-5
    input_channel: 2
    output_channel: 1
    n_fft: 400
    scan_backend: fused
  stft:
    hop: 100
    win: 400

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: false
