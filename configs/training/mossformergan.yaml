# MossFormerGAN SE 16 kHz. num_channel 64 is the released width.
# Discriminator learning rate is twice the generator learning rate.

seed: 1234
deterministic: true
global_batch_size: 1
micro_batch_size_per_gpu: 1
max_steps: 1
segment_size: 8000
loss: official
grad_clip: 10.0
checkpoint_dir: data/results/training/mossformergan
checkpoint_interval: 0
validation_interval: 0
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.8, 0.99]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  database: data/db/training.duckdb
  train_set: libri_demand_smoke_train
  validation_set: libri_demand_smoke_valid

runtime:
  device: cpu
  allow_busy_gpu: false
