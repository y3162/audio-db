# MossFormerGAN fixed pairs for the official 2-GPU launch.
# Global batch 4, micro-batch 1, accumulation 2 on each of 2 processes.
# Do not launch this file with one process: that keeps global batch 4 by
# raising accumulation to 4. 121 passes x 2,893 updates = 350,053 updates.

seed: 777
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 1
max_steps: 350053
segment_size: 32000
loss: official
grad_clip: 10.0
checkpoint_dir: ./data/results/training/reproduction/mossformergan.vb28.official-2gpu
checkpoint_interval: 2893
validation_interval: 2893
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  pipeline: reproduction
  dataset: mossformergan.vb28.official@1
  allow_test_selection: true
  load_workers: 4
  prefetch: true
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false
