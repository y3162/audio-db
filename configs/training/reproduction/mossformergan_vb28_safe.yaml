# Leakage-safe MossFormerGAN on mossformergan.vb28.ondemand.safe@1.
# 16 kHz PCM_16 is resampled from the 48 kHz source when a batch is rendered.
# Train 10,700, validation p286/p287.
# One process, global batch 2 (micro 1 x accumulation 2). 121 passes.

seed: 777
deterministic: false
global_batch_size: 2
micro_batch_size_per_gpu: 1
required_world_size: 1
experiment_profile: full
experiment_claim: leakage_safe
max_steps: 647350
segment_size: 32000
loss: official
grad_clip: 10.0
checkpoint_dir: ./data/results/training/reproduction/mossformergan.vb28.ondemand.safe
checkpoint_interval: 5350
validation_interval: 5350
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  pipeline: reproduction
  dataset: mossformergan.vb28.ondemand.safe@1
  allow_test_selection: false
  load_workers: 4
  prefetch: true
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false
