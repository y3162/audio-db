# Full research run config, not a smoke.
# This is NOT official cv_synthetic_small and NOT a claim of full official
# reproduction. It is a research protocol that selects checkpoints on a fixed
# small validation subset. The original 36000-utterance validation dataset
# is unchanged. Selection uses valid.loss. allow_test_selection is false.
# 150 epochs at 14000 updates is 2100000 optimizer updates
# (docs/training/reproduction/P10_C_EXECUTION_PLAN.md).
# validation_interval 0 and checkpoint_interval 0 validate and save at epoch
# end. keep_nbest 5 epoch files are inputs to the average and must be kept.

seed: 0
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 1
required_world_size: 4
experiment_profile: full
experiment_claim: research_checkpoint_selection
max_steps: 2100000
segment_size: 64000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/reproduction/tf_locoformer.dns.accept_recipe.research_valid_fixed-full
checkpoint_interval: 0
checkpoint_retention:
  keep_latest: 3
  keep_best: true
  protect_nbest: true
validation_interval: 0
best_checkpoint_start_epoch: 0

chunk_iterator:
  num_samples_per_epoch: 1000
  chunk_length: 64000
  chunk_shift_ratio: 0.5
  num_cache_chunks: 1024
  shuffle: true
  max_epochs: 150
  early_stopping_patience: 10
  keep_nbest: 5

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: warmup_reduce_on_plateau
  warmup_steps: 4000
  mode: min
  factor: 0.5
  patience: 3

model:
  name: tf_locoformer
  variant: dns
  init: xavier_uniform
  sampling_rate: 16000
  architecture: {}
  stft: {}

data:
  pipeline: reproduction
  dataset: tf_locoformer.dns.accept_recipe.research_valid_fixed@1
  allow_test_selection: false
  load_workers: 2
  prefetch: false
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
