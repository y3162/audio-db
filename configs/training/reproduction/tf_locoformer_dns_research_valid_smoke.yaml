# Short research-validation smoke. Not the 150-epoch run.
# The full YAML is configs/training/reproduction/tf_locoformer_dns_research_valid_full.yaml
# and is not edited for this cap. validation_max_updates covers one chunk per
# rank after iterator_stop. It is not the 1024-case validation.
# verification_max_updates stops the run and writes interrupted.json.

seed: 0
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 1
required_world_size: 4
experiment_claim: research_checkpoint_selection
max_steps: 2100000
verification_max_updates: 3
segment_size: 64000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/reproduction/fix2c-tf-locoformer-smoke
checkpoint_interval: 1
validation_interval: 0
best_checkpoint_start_epoch: 0

chunk_iterator:
  num_samples_per_epoch: 1000
  chunk_length: 64000
  chunk_shift_ratio: 0.5
  num_cache_chunks: 128
  shuffle: true
  max_epochs: 150
  early_stopping_patience: 10
  keep_nbest: 5
  max_updates: 3
  validation_max_updates: 1

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: warmup_reduce_on_plateau
  warmup_steps: 4000
  mode: min
  factor: 0.5
  patience: 3

model:
  name: tf_locoformer
  variant: dns
  init: xavier_uniform
  sampling_rate: 16000
  architecture: {}
  stft: {}

data:
  pipeline: reproduction
  dataset: tf_locoformer.dns.accept_recipe.research_valid_fixed@1
  allow_test_selection: false
  load_workers: 2
  prefetch: false
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: false
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
