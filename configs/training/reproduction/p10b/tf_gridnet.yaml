# P10-B smoke. Official MS-SNSD TF-GridNet, 2 ranks, global batch 4.
# num_samples_per_epoch 5000 is the official per-rank utterance count.
# max_updates keeps 2 optimizer steps so the epoch-end path can run.
# validation_max_updates is the first aligned validation batch on each rank.
# That prefix is not cv_ms_snsd and not the full 1,835-utterance validation.

seed: 0
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 2
max_steps: 2
segment_size: 48000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/p10b/placeholder/tf_gridnet
checkpoint_interval: 2
validation_interval: 0
best_checkpoint_start_epoch: 0

chunk_iterator:
  num_samples_per_epoch: 5000
  chunk_length: 48000
  chunk_shift_ratio: 0.5
  num_cache_chunks: 1024
  shuffle: true
  max_epochs: 2
  early_stopping_patience: 5
  keep_nbest: 5
  max_updates: 2
  validation_max_updates: 1

optimizer:
  name: adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0

scheduler:
  name: plateau
  factor: 0.7
  patience: 1

model:
  name: tf_gridnet
  variant: ms-snsd
  init: xavier_uniform
  sampling_rate: 16000
  architecture:
    n_fft: 512
    stride: 256
    n_layers: 4
    lstm_hidden_units: 128
    attn_n_head: 4
    attn_approx_qk_dim: 512
    emb_dim: 32
    emb_ks: 4
    emb_hs: 4
    activation: prelu
    eps: 1.0e-5
  stft: {}

data:
  pipeline: reproduction
  dataset: tf_gridnet.ms_snsd.espnet_recipe@1
  allow_test_selection: false
  load_workers: 2
  prefetch: false
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
