# P10-B smoke. Official DNS medium TF-Locoformer, 4 ranks, global batch 4.
# num_samples_per_epoch 1000 is the official per-rank utterance count.
# max_updates keeps 2 optimizer steps. verification_max_updates stops the
# smoke before 150 epochs and writes interrupted.json, not complete.json.
# validation_max_updates is one chunk
# per rank after iterator_stop. The 36,000-utterance tail is not
# cv_synthetic_small, and this prefix is not that full validation.
# ave_5best is written only after five retained epochs. One epoch writes
# valid.loss.ave_1best instead.

seed: 0
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 1
max_steps: 2100000
verification_max_updates: 2
segment_size: 64000
loss: official
grad_clip: 5.0
checkpoint_dir: data/results/training/p10b/placeholder/tf_locoformer
checkpoint_interval: 2
validation_interval: 0
best_checkpoint_start_epoch: 0

chunk_iterator:
  num_samples_per_epoch: 1000
  chunk_length: 64000
  chunk_shift_ratio: 0.5
  num_cache_chunks: 1024
  shuffle: true
  max_epochs: 150
  early_stopping_patience: 10
  keep_nbest: 5
  max_updates: 2
  validation_max_updates: 1

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: warmup_reduce_on_plateau
  warmup_steps: 4000
  mode: min
  factor: 0.5
  patience: 3

model:
  name: tf_locoformer
  variant: dns
  init: xavier_uniform
  sampling_rate: 16000
  architecture: {}
  stft: {}

data:
  pipeline: reproduction
  dataset: tf_locoformer.dns.accept_recipe@1
  allow_test_selection: false
  load_workers: 2
  prefetch: false
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
