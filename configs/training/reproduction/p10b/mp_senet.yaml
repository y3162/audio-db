# P10-B smoke. Official MP-SENet width, 2 GPU, global batch 4.
# data.max_updates_per_epoch ends the epoch after 2 updates so validation
# and the exponential scheduler run. This is not a 2,893-update epoch.
# validation_max_batches is a prefix of the official validation order.
# best_checkpoint_start_epoch is 0 here so the PESQ writer can run.
# The released gate is epoch 40.

seed: 1234
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 4
max_steps: 2
segment_size: 32000
loss: official
checkpoint_dir: data/results/training/p10b/placeholder/mp_senet
checkpoint_interval: 2
validation_interval: 2
best_checkpoint_start_epoch: 0

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.8, 0.99]
  weight_decay: 0.01

scheduler:
  name: exponential
  gamma: 0.99

model:
  name: mp_senet
  dense_channel: 64
  num_tsconformers: 4
  n_fft: 400
  hop_size: 100
  win_size: 400
  compress_factor: 0.3
  beta: 2.0
  sampling_rate: 16000

data:
  pipeline: reproduction
  dataset: mp_senet.vb28.ondemand.official@1
  allow_test_selection: true
  load_workers: 4
  prefetch: true
  verify_on_read: false
  max_updates_per_epoch: 2
  validation_max_batches: 2

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
