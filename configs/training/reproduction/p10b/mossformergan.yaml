# P10-B smoke. Official MossFormerGAN SE 16 kHz, 2 GPU.
# Per GPU: micro-batch 1 and accumulation 2. Global batch 4.
# The epoch cap and validation prefix are smoke limits, not the 121-epoch run.
# Plateau sees the official generator loss on that prefix.

seed: 777
deterministic: false
global_batch_size: 4
micro_batch_size_per_gpu: 1
max_steps: 2
segment_size: 32000
loss: official
grad_clip: 10.0
checkpoint_dir: data/results/training/p10b/placeholder/mossformergan
checkpoint_interval: 2
validation_interval: 2
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  pipeline: reproduction
  dataset: mossformergan.vb28.ondemand.official@1
  allow_test_selection: true
  load_workers: 4
  prefetch: true
  verify_on_read: false
  max_updates_per_epoch: 2
  validation_max_batches: 2

runtime:
  device: cuda
  allow_busy_gpu: false

logging:
  tensorboard:
    enabled: true
    scalar_interval: 1
    audio:
      enabled: false
      max_cases: 0
      max_seconds: 1
    spectrogram: false
