# MossFormerGAN fixed pairs, one process.
# Official 1-GPU effective batch is micro-batch 1 x accumulation 2 (global 2).
# The protocol's 2-GPU global batch is 4; see mossformergan_vb28_official_2gpu.yaml.
# The public solver loops epochs 0..120 inclusive (121 passes).
# 11,572 utterances give 5,786 updates per pass.

seed: 777
deterministic: false
global_batch_size: 2
micro_batch_size_per_gpu: 1
max_steps: 700106
segment_size: 32000
loss: official
grad_clip: 10.0
checkpoint_dir: ./data/results/training/reproduction/mossformergan.vb28.official
checkpoint_interval: 5786
validation_interval: 5786
best_checkpoint_start_epoch: 40

optimizer:
  name: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  name: none

model:
  name: mossformergan
  variant: se_16k
  sampling_rate: 16000
  architecture:
    n_fft: 400
    win_len: 400
    hop: 100
    num_channel: 64

data:
  pipeline: reproduction
  dataset: mossformergan.vb28.official@1
  allow_test_selection: true
  load_workers: 4
  prefetch: true
  verify_on_read: false

runtime:
  device: cuda
  allow_busy_gpu: false
