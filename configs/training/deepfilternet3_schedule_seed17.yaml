# Official DeepFilterNet3 batch schedule on the shared VoiceBank-DEMAND split.
# batch_size_limit 64 is config.ini batch_size. The schedule is
# 0/16,2/24,5/32,10/64,20/128,40/9999, and each epoch uses
# min(schedule, batch_size_limit). 9999 and 128 therefore run at 64.
# The per-step cosine is rebuilt from the current loader length and indexed as
# epoch * steps + step, matching df/train.py. early_stopping_patience 25 and
# max_epochs 120 are the shipped config.ini values, not the Python default 10.
# max_steps is the exact optimizer-step count of 120 epochs on 10,700
# utterances: 2*floor(10700/16)+3*floor(10700/24)+5*floor(10700/32)
# +110*floor(10700/64) = 22711. The next step would index past the cosine
# table. Gradient accumulation is not substituted for a batch that does not fit.
# Validation is one utterance at a time, then an unweighted mean. That is not
# the official mean of padded eval batches. Online mixing is not used.

seed: 17
deterministic: false
global_batch_size: 64
micro_batch_size_per_gpu: 64
batch_size_limit: 64
batch_schedule:
  - [0, 16]
  - [2, 24]
  - [5, 32]
  - [10, 64]
  - [20, 128]
  - [40, 9999]
max_steps: 22711
segment_size: 144000
loss: official
grad_clip: 1.0
checkpoint_dir: data/results/training/deepfilternet3-schedule-seed17
checkpoint_interval: 0
validation_interval: 0
best_checkpoint_start_epoch: 0
early_stopping_patience: 25

optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 1.0e-12
  amsgrad: true

scheduler:
  name: deepfilter_cosine
  steps_per_epoch: 668
  epochs: 120
  lr_min: 1.0e-6
  lr_warmup: 1.0e-4
  warmup_epochs: 3
  weight_decay_end: 0.01

model:
  name: deepfilternet3
  sampling_rate: 48000
  architecture: {}

data:
  database: data/db/voicebank.duckdb
  train_set: voicebank_28_train
  validation_set: voicebank_28_valid
  load_workers: 4
  prefetch: true

runtime:
  device: cuda
  allow_busy_gpu: false
