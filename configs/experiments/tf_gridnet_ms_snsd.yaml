# Phase 4-B TF-GridNet MS-SNSD training algorithm.
# This declares the official single-optimizer recipe. It is not a full run:
# max_logical_steps is 1, so an epoch does not finish and validation does not run.
# Acceptance tests use a tiny architecture and a synthetic snapshot.
schema: audio-db-experiment/v1
seed: 0
deterministic: true
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cpu
    precision: fp32
output:
  directory: runs/tf-gridnet-ms-snsd
components:
  model:
    role: module
    class: src.experiments.models.tf_gridnet.TFGridNetModel
    kwargs:
      seed: 0
      variant: ms-snsd
      init: xavier_uniform
      architecture:
        n_fft: 512
        stride: 256
        n_layers: 4
        lstm_hidden_units: 128
        attn_n_head: 4
        attn_approx_qk_dim: 512
        emb_dim: 32
        emb_ks: 4
        emb_hs: 4
        activation: prelu
        eps: 1.0e-5
    prepare: {trainable: true, distribute: none}
  loss:
    role: loss
    class: src.experiments.losses.MultiResolutionL1Loss
    kwargs:
      windows: [256, 512, 768, 1024]
      time_domain_weight: 0.5
      normalize_variance: false
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: tf_gridnet.ms_snsd.espnet_recipe@1
      snapshot_root: data/db/snapshots
      split: train
  sampler:
    role: other
    class: src.experiments.data.ChunkSampler
    kwargs:
      seed: 0
      num_samples_per_epoch: 5000
      chunk_length: 48000
      shift_ratio: 0.5
      num_cache_chunks: 1024
      shuffle: true
      global_batch: 4
    inject:
      source: {ref: source}
  protocol:
    role: other
    class: src.experiments.data.ChunkProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 2
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optimizer:
    role: optimizer
    class: torch.optim.Adam
    parameters_of: model
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.0
  scheduler:
    role: scheduler
    class: torch.optim.lr_scheduler.ReduceLROnPlateau
    kwargs:
      mode: min
      factor: 0.7
      patience: 1
    inject:
      optimizer: {ref: optimizer}
  trainer:
    role: trainer
    class: src.experiments.tf_gridnet.TFGridNetTrainer
    kwargs:
      max_logical_steps: 1
      accumulation: 1
      grad_clip: 5.0
      keep_nbest: 5
      max_epochs: 35
      early_stopping_patience: 5
      checkpoint_interval: 1
    inject:
      model: {ref: model}
      loss: {ref: loss}
      data: {ref: data}
      optimizer: {ref: optimizer}
      scheduler: {ref: scheduler}
