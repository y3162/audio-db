# Phase 5 production candidate. Do not launch from this readiness session.
# Largest measured shape on one A100 40GB: official width, fused scan, 3 seconds,
# micro-batch 4, accumulation 1. This is not official one-forward batch 8.
# Peak reserved memory on that measurement was 27.1 GiB. Batch 8 stays unrun.
# Snapshot is semambapp.gsr.smoke@1. semambapp.gsr.official@1 stays blocked.
# max_logical_steps is a safety cap, not a counted epoch budget for this smoke set.
# Launch with .venvs/semambapp and one visible GPU. resampy 0.4.3 is required.
schema: audio-db-experiment/v1
seed: 1234
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/semambapp-gsr-micro4
components:
  generator:
    role: module
    class: src.experiments.models.semambapp.SEMambaPPGenerator
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-5
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  mrd:
    role: module
    class: src.experiments.models.semambapp.SEMambaPPMRD
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-5
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  cqt:
    role: module
    class: src.experiments.models.semambapp.SEMambaPPCQTDiscriminator
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-5
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: semambapp.gsr.smoke@1
      snapshot_root: data/db/snapshots
      split: train
  protocol:
    role: other
    class: src.experiments.data.SemambaProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 1234
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 4
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0002
      betas: [0.8, 0.99]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of:
      - mrd
      - cqt
    kwargs:
      lr: 0.0002
      betas: [0.8, 0.99]
      weight_decay: 0.01
  scheduler_g:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_g}
  scheduler_d:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_d}
  trainer:
    role: trainer
    class: src.experiments.semambapp.SEMambaPPTrainer
    kwargs:
      max_logical_steps: 1000000
      accumulation: 1
      grad_clip: null
      validation_interval: 0
      checkpoint_interval: 1000
      best_checkpoint_start_epoch: 40
      claim_label: protocol_conformant_substitute_materials
    inject:
      generator: {ref: generator}
      mrd: {ref: mrd}
      cqt: {ref: cqt}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
      scheduler_g: {ref: scheduler_g}
      scheduler_d: {ref: scheduler_d}
