# Leakage-safe MossFormerGAN. Do not launch from the Phase 6 fix session.
# Same GAN, optimizer order, PESQ skip, accumulation, and plateau as the official 2-GPU file.
# Snapshot is mossformergan.vb28.ondemand.safe@1. Train is 10,700 utterances.
# World size 2, micro-batch 1, accumulation 2, global batch 4: 2,675 updates per pass.
# 121 passes are 323,675 updates. Validation is p286/p287. Test is not a selection split.
# Scratch start: do not pass an initialization checkpoint.
# checkpoint_interval is 90 logical steps, the same audit value as the official file.
# Launch with 2 visible GPUs. World size 1 is a different global batch.
schema: audio-db-experiment/v1
seed: 777
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase6-production/mossformergan-se-16k-leakage-safe
components:
  generator:
    role: module
    class: src.experiments.models.mossformergan.MossFormerGANGenerator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  discriminator:
    role: module
    class: src.experiments.models.mossformergan.MossFormerGANDiscriminator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mossformergan.vb28.ondemand.safe@1
      snapshot_root: data/db/snapshots
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 777
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 2
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: leakage_safe
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.9, 0.999]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: discriminator
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.01
  trainer:
    role: trainer
    class: src.experiments.mossformergan.MossFormerGANTrainer
    kwargs:
      max_logical_steps: 323675
      accumulation: 2
      grad_clip: 10.0
      experiment_claim: leakage_safe
      checkpoint_interval: 90
      validate_on_epoch_end: true
    inject:
      generator: {ref: generator}
      discriminator: {ref: discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
