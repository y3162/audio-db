# Phase 5 production candidate. Do not launch from this readiness session.
# World size 1 and the shipped batch schedule on dfn3.online.smoke@1.
# This is not the 10,700-utterance VoiceBank schedule and not 22,711 updates.
# max_epochs 120 stops the run. max_logical_steps is only a safety cap.
# The cosine table is rebuilt from the loader length. Official materials stay blocked.
# Launch with 1 visible GPU. batch_schedule with world size > 1 is refused.
schema: audio-db-experiment/v1
seed: 7
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/deepfilternet3-smoke-schedule
components:
  model:
    role: module
    class: src.experiments.models.deepfilternet3.DeepFilterNet3Model
    kwargs:
      seed: 7
      variant: deepfilternet3
      architecture: {}
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: dfn3.online.smoke@1
      snapshot_root: data/db/snapshots
      split: train
  sampler:
    role: other
    class: src.experiments.data.Dfn3IndexSampler
    kwargs:
      seed: 7
      global_batch: 16
    inject:
      source: {ref: source}
  protocol:
    role: other
    class: src.experiments.data.Dfn3Protocol
    kwargs: {}
    inject:
      source: {ref: source}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 16
      group_size: 1
      keep_partial: true
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optimizer:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: model
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 1.0e-12
      amsgrad: true
  trainer:
    role: trainer
    class: src.experiments.deepfilternet3.DeepFilterNet3Trainer
    kwargs:
      max_logical_steps: 1000000
      accumulation: 1
      grad_clip: 1.0
      max_epochs: 120
      early_stopping_patience: 25
      steps_per_epoch: 1
      epochs: 120
      lr_min: 1.0e-6
      lr_warmup: 1.0e-4
      warmup_epochs: 3
      weight_decay_end: 0.01
      batch_size_limit: 64
      batch_schedule:
        - [0, 16]
        - [2, 24]
        - [5, 32]
        - [10, 64]
        - [20, 128]
        - [40, 9999]
      checkpoint_interval: 1
    inject:
      model: {ref: model}
      data: {ref: data}
      optimizer: {ref: optimizer}
