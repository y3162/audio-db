  path: train/speech_enhancement/dataloader/dataloader.py
  document: docs/training/reproduction/mossformergan.md
deviations:
  - id: vb28-ondemand-resample
    class: official_effective
    text: "16 kHz float32 is produced at training time from the 48 kHz source with soxr HQ without additional clipping or quantization. Pre-written 16 kHz wavs are not required. The official converter remains unknown."
    ref: "UN-3"
