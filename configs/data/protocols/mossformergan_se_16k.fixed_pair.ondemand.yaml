name: mossformergan_se_16k.fixed_pair.ondemand
version: 1
kind: fixed_pair
algorithm: fixed_pair.mossformergan_se_16k
algorithm_version: 1
deviation_class: official_effective
parent_name: mossformergan_se_16k.fixed_pair
rule:
  sample_rate: 16000
  teacher: dry_clean
  normalize: independent_audio_norm_v1
  window: 32000
  order: rank_mod_fixed_v1
  epoch_unit: utterance
  global_batch: 4
  delivery: on_demand
  resample:
    tool: soxr
    quality: HQ
    source_rate: 48000
    target_rate: 16000
    length: source_frames_plus_one_div_3
    order:
      - read_float32
      - soxr_hq
      - protocol_normalize
      - protocol_window
  validation:
    crop: per_epoch_random
    batch: 1
    note: "train.sh defaults to 2 GPUs and an effective batch of 2 per GPU. Validation uses a 2 second crop. 16 kHz float32 is resampled from the 48 kHz source when the batch is rendered."
official_ref:
  repo: https://github.com/modelscope/ClearerVoice-Studio
