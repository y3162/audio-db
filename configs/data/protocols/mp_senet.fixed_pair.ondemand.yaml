name: mp_senet.fixed_pair.ondemand
version: 1
kind: fixed_pair
algorithm: fixed_pair.mp_senet
algorithm_version: 1
deviation_class: official_effective
parent_name: mp_senet.fixed_pair
rule:
  sample_rate: 16000
  teacher: dry_clean
  normalize: noisy_rms_unit_v1
  window: 32000
  order:
    - fixed_single_shuffle_v1
    - torch_distributed_sampler_v1
  epoch_unit: utterance
  global_batch: 4
  delivery: on_demand
  resample:
    tool: soxr
    quality: HQ
    source_rate: 48000
    target_rate: 16000
    quantization: pcm16
    length: source_frames_plus_one_div_3
    order:
      - read_float32
      - soxr_hq
      - clip_to_unit
      - pcm16_roundtrip
      - protocol_normalize
      - protocol_window
  validation:
    crop: full_length
    batch: 1
    interval: 5000
    note: "1 GPU uses fixed_single_shuffle_v1. DDP uses torch_distributed_sampler_v1. Validation is the full utterance. 16 kHz PCM_16 is resampled from the 48 kHz source when the batch is rendered."
official_ref:
  repo: https://github.com/yxlu-0102/MP-SENet
  commit: 89932cfe90d1dacb8e170e4a331d762462c21792
  path: dataset.py
  document: docs/training/reproduction/mp_senet.md
deviations:
  - id: vb28-ondemand-resample
    class: official_effective
    text: "16 kHz PCM_16 is produced at training time from the 48 kHz source with soxr HQ and a PCM_16 round trip. Pre-written 16 kHz wavs are not required. The official converter remains unknown."
    ref: "UN-3"
