# Official-scale MS-SNSD conditions for the ESPnet public SE recipe.
# Not a TF-GridNet paper experiment. Commit 0d136c5456d403cb2c0a4c13e76e8136e32e9b7a.
# source_scan full is the explicit opt-in for null limits. Registration hashes
# every selected source and mixes only audit_realizations in memory.

name: tf_gridnet.ms_snsd.espnet_recipe
seed: 17
shard_size: 1000
claim_label: espnet_public_se_recipe_reproduction
delivery: on_demand
source_scan: full
audit_realizations: 1000
train:
  total_hours: 30
  max_clips: null
  clean_limit: null
  noise_limit: null
test:
  total_hours: 1
  max_clips: null
  clean_limit: null
  noise_limit: null
