checkpoint:
  selector:
    class: src.experiments.selectors.PeriodicArchiveSelector
    kwargs:
      archive_every: 1447
      latest_every: 1000000
components:
  adversarial_loss:
    class: src.experiments.losses.SummedLeastSquaresGenerator
    kwargs:
      first: fake_cqt
      name: adversarial
      second: fake_mrd
    role: loss
  asr:
    class: src.research.asr_guided_se.asr.FrozenParakeet
    kwargs:
      model_id: nvidia/parakeet-tdt-0.6b-v2
      tdt_loss: true
    role: other
  batcher:
    class: src.experiments.data.MicroBatcher
    kwargs:
      group_size: 8
      keep_partial: true
      micro_batch_size: 1
    role: other
  complex_loss:
    class: src.experiments.losses.ScaledComplexMSE
    kwargs:
      estimate: generated_complex
      name: complex
      scale: 2.0
      target: clean_complex
    role: loss
  consistency_loss:
    class: src.experiments.losses.ScaledComplexMSE
    kwargs:
      estimate: recomputed_complex
      name: consistency
      scale: 2.0
      target: generated_complex
    role: loss
  cqt:
    class: src.models.semambapp.models.SEMambaPPCQTDiscriminator
    kwargs:
      cqt_bins_per_octave:
      - 12
      - 24
      - 36
      cqt_channels: 128
      cqt_hops:
      - 512
      - 256
      - 256
      cqt_octaves:
      - 8
      - 8
      - 8
      d_conv: 4
      d_state: 16
      expand: 2
      hid_feature: 48
      hop: 100
      input_channel: 2
      mrd_channels: 32
      mrd_resolutions:
      - - 1024
        - 120
        - 600
      - - 2048
        - 240
        - 1200
      - - 512
        - 50
        - 240
      n_fft: 400
      norm_epsilon: 1.0e-05
      num_tfmamba: 4
      output_channel: 1
      sampling_rate: 16000
      scan_backend: fused
      seed: 42
      win: 400
    prepare:
      distribute: ddp
      trainable: true
    role: module
  data:
    class: src.experiments.data.SnapshotDataModule
    inject:
      batcher:
        ref: batcher
      protocol:
        ref: protocol
      sampler:
        ref: sampler
      source:
        ref: source
    kwargs:
      prefetch: false
    role: data
  discriminator_objective:
    class: src.experiments.losses.WeightedObjective
    inject:
      terms:
      - ref: discriminator_term
    kwargs:
      weights:
        discriminator: 1.0
    role: loss
  discriminator_term:
    class: src.experiments.losses.SummedLeastSquaresDiscriminator
    kwargs:
      first_fake: fake_cqt
      first_real: real_cqt
      name: discriminator
      second_fake: fake_mrd
      second_real: real_mrd
    role: loss
  generator:
    class: src.research.asr_guided_se.semambapp.v1.model.GuidedSEMambaPPGenerator
    inject:
      asr:
        ref: asr
      guidance:
        ref: guidance
    kwargs:
      cqt_bins_per_octave:
      - 12
      - 24
      - 36
      cqt_channels: 128
      cqt_hops:
      - 512
      - 256
      - 256
      cqt_octaves:
      - 8
      - 8
      - 8
      d_conv: 4
      d_state: 16
      expand: 2
      hid_feature: 48
      hop: 100
      input_channel: 2
      mrd_channels: 32
      mrd_resolutions:
      - - 1024
        - 120
        - 600
      - - 2048
        - 240
        - 1200
      - - 512
        - 50
        - 240
      n_fft: 400
      norm_epsilon: 1.0e-05
      num_tfmamba: 4
      output_channel: 1
      sampling_rate: 16000
      scan_backend: fused
      seed: 42
      win: 400
    prepare:
      distribute: ddp
      trainable: true
    role: module
  generator_objective:
    class: src.experiments.losses.WeightedObjective
    inject:
      terms:
      - ref: adversarial_loss
      - ref: matching_loss
      - ref: mel_loss
      - ref: magnitude_loss
      - ref: phase_loss
      - ref: complex_loss
      - ref: consistency_loss
    kwargs:
      weights:
        adversarial: 1.0
        complex: 0.1
        consistency: 0.1
        magnitude: 0.9
        matching: 1.0
        mel: 0.1
        phase: 0.3
    role: loss
  guidance:
    class: src.research.asr_guided_se.semambapp.v1.config.GuidanceV1
    kwargs:
      asr_features_enabled: true
      encoder_layer: 15
      error_weight_alpha: 1.0
      error_weight_enabled: true
      tdt_loss_enabled: true
    role: other
  magnitude_loss:
    class: src.experiments.losses.MagnitudeMSE
    kwargs:
      estimate: generated_mag
      name: magnitude
      target: clean_mag
    role: loss
  matching_loss:
    class: src.experiments.losses.PairedFeatureMatching
    kwargs:
      first_fake: fake_cqt_features
      first_real: real_cqt_features
      name: matching
      reduction: sum
      scale: 2.0
      second_fake: fake_mrd_features
      second_real: real_mrd_features
    role: loss
  mel_loss:
    class: src.experiments.losses.SlaneyLogMelLoss
    kwargs:
      clamp: 1.0e-05
      n_mels:
      - 40
      - 80
      - 160
      - 320
      name: mel
      windows:
      - 256
      - 512
      - 1024
      - 2048
    role: loss
  mrd:
    class: src.models.semambapp.models.SEMambaPPMRD
    kwargs:
      cqt_bins_per_octave:
      - 12
      - 24
      - 36
      cqt_channels: 128
      cqt_hops:
      - 512
      - 256
      - 256
      cqt_octaves:
      - 8
      - 8
      - 8
      d_conv: 4
      d_state: 16
      expand: 2
      hid_feature: 48
      hop: 100
      input_channel: 2
      mrd_channels: 32
      mrd_resolutions:
      - - 1024
        - 120
        - 600
      - - 2048
        - 240
        - 1200
      - - 512
        - 50
        - 240
      n_fft: 400
      norm_epsilon: 1.0e-05
      num_tfmamba: 4
      output_channel: 1
      sampling_rate: 16000
      scan_backend: fused
      seed: 42
      win: 400
    prepare:
      distribute: ddp
      trainable: true
    role: module
  optim_d:
    class: torch.optim.AdamW
    kwargs:
      betas:
      - 0.8
      - 0.99
      lr: 0.0002
      weight_decay: 0.01
    parameters_of:
    - mrd
    - cqt
    role: optimizer
  optim_g:
    class: torch.optim.AdamW
    kwargs:
      betas:
      - 0.8
      - 0.99
      lr: 0.0002
      weight_decay: 0.01
    parameters_of: generator
    role: optimizer
  pesq:
    class: src.experiments.metrics.PESQMetric
    kwargs:
      name: pesq
    role: metric
  phase_loss:
    class: src.experiments.losses.PhaseLoss
    kwargs:
      mode: matrix
      name: phase
    role: loss
  protocol:
    class: src.research.asr_guided_se.semambapp.v1.voicebank.VoicebankAblationProtocol
    inject:
      source:
        ref: source
    kwargs:
      sample_rate: 16000
      window: 48000
    role: other
  sampler:
    class: src.experiments.data.OrderSampler
    inject:
      protocol:
        ref: protocol
      source:
        ref: source
    kwargs:
      order: per_rank_independent_v1
      seed: 42
      validation_batch: 1
      validation_scope: rank0
    role: other
  scheduler_d:
    class: torch.optim.lr_scheduler.ExponentialLR
    inject:
      optimizer:
        ref: optim_d
    kwargs:
      gamma: 0.99
    role: scheduler
  scheduler_g:
    class: torch.optim.lr_scheduler.ExponentialLR
    inject:
      optimizer:
        ref: optim_g
    kwargs:
      gamma: 0.99
    role: scheduler
  selection:
    class: src.experiments.selection.BestMetricSelection
    kwargs:
      metric: validation.wer
      mode: min
      tie_break: earlier
    role: other
    state:
      save: true
  si_sdr:
    class: src.experiments.metrics.SISDRMetric
    kwargs:
      name: si_sdr
    role: metric
  source:
    class: src.research.asr_guided_se.semambapp.v1.voicebank.VoicebankAblationSource
    kwargs:
      allow_test_selection: true
      snapshot: voicebank.snr_shift.minus_15db@1
      snapshot_root: data/db/snapshots
      split: train
    role: other
  stoi:
    class: src.experiments.metrics.STOIMetric
    kwargs:
      name: stoi
    role: metric
  trainer:
    class: src.research.asr_guided_se.semambapp.v1.trainer.GuidedSEMambaPPTrainer
    inject:
      asr:
        ref: asr
      cqt:
        ref: cqt
      data:
        ref: data
      discriminator_objective:
        ref: discriminator_objective
      evaluators:
        ref: validation_eval
      generator:
        ref: generator
      generator_objective:
        ref: generator_objective
      guidance:
        ref: guidance
      model_selection:
        ref: selection
      mrd:
        ref: mrd
      optim_d:
        ref: optim_d
      optim_g:
        ref: optim_g
      scheduler_d:
        ref: scheduler_d
      scheduler_g:
        ref: scheduler_g
    kwargs:
      best_checkpoint_start_epoch: 0
      claim_label: research
      condition_id: A7
      experiment_claim: research
      experiment_id: voicebank_m15db_test_selection
      global_batch_size: 8
      grad_clip: null
      max_epochs: 100
      max_logical_steps: 10000000
      micro_batch_size: 1
      model_id: asr_guided_se.semambapp.v1
      valid_frame_aggregation: true
      validation_interval: 0
    role: trainer
  validation_eval:
    class: src.experiments.evaluation.AudioPairEvaluator
    inject:
      data:
        ref: data
      metrics:
      - ref: wer
      - ref: pesq
      - ref: stoi
      - ref: si_sdr
      model:
        ref: generator
    kwargs:
      every:
        interval: 1
        unit: epoch
      sample_rate: 16000
      source: validation
    role: evaluator
  wer:
    class: src.experiments.metrics.WerMetric
    inject:
      recognizer:
        ref: asr
    kwargs:
      name: wer
      normalization: wer-norm-v1
    role: metric
deterministic: true
entry: trainer
output:
  directory: data/results/research/asr_guided_se/semambapp/v1/voicebank_m15db_test_selection/A7
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
schema: audio-db-experiment/v1
seed: 42
