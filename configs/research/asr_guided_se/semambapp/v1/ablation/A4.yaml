# A4: ASR features on, TDT on, error weighting off.
extends: A0.yaml
output:
  directory: data/results/research/asr_guided_se/semambapp/v1/voicebank_m15db_ablation/A4
components:
  guidance:
    kwargs:
      asr_features_enabled: true
      tdt_loss_enabled: true
  asr:
    kwargs:
      tdt_loss: true
  generator:
    inject:
      asr: {ref: asr}
  trainer:
    kwargs:
      condition_id: A4
    inject:
      asr: {ref: asr}
