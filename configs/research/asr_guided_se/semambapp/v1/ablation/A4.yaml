# A4: ASR features on, TDT on, error weighting off.
extends: A0.yaml
output:
  directory: data/results/experiments/error_aware_se_mamba_pp/ablation/A4
components:
  guidance:
    kwargs:
      asr_features_enabled: true
      tdt_loss_enabled: true
  asr:
    kwargs:
      tdt_loss: true
  generator:
    inject:
      asr: {ref: asr}
  trainer:
    inject:
      asr: {ref: asr}
