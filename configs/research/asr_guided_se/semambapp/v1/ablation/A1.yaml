# A1: ASR features on, TDT off, error weighting off.
extends: A0.yaml
output:
  directory: data/results/research/asr_guided_se/semambapp/v1/voicebank_m15db_test_selection/A1
components:
  batcher:
    kwargs:
      micro_batch_size: 4
      group_size: 2
  guidance:
    kwargs:
      asr_features_enabled: true
  generator:
    inject:
      asr: {ref: asr}
  trainer:
    kwargs:
      condition_id: A1
      micro_batch_size: 4
    inject:
      asr: {ref: asr}
