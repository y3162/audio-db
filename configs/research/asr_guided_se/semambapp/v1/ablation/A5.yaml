# A5: ASR features on, TDT off, error weighting on.
extends: A0.yaml
output:
  directory: data/results/experiments/error_aware_se_mamba_pp/ablation/A5
components:
  guidance:
    kwargs:
      asr_features_enabled: true
      error_weight_enabled: true
  generator:
    inject:
      asr: {ref: asr}
  trainer:
    inject:
      asr: {ref: asr}
