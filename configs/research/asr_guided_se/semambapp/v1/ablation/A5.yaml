# A5: ASR features on, TDT off, error weighting on.
extends: A0.yaml
output:
  directory: data/results/research/asr_guided_se/semambapp/v1/voicebank_m15db_test_selection/A5
components:
  guidance:
    kwargs:
      asr_features_enabled: true
      error_weight_enabled: true
  generator:
    inject:
      asr: {ref: asr}
  trainer:
    kwargs:
      condition_id: A5
    inject:
      asr: {ref: asr}
