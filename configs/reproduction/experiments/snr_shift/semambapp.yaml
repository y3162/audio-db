# SNR-shift inputs only; official GSR degradations are not applied.
schema: audio-db-experiment/v1
seed: 1234
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/snr-shift-v1/semambapp
checkpoint:
  selector:
    class: src.experiments.selectors.StandardSelector
    kwargs:
      latest_every: 45
components:
  generator:
    role: module
    class: src.experiments.official.semambapp.models.SEMambaPPGenerator
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-05
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  mrd:
    role: module
    class: src.experiments.official.semambapp.models.SEMambaPPMRD
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-05
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  cqt:
    role: module
    class: src.experiments.official.semambapp.models.SEMambaPPCQTDiscriminator
    kwargs:
      seed: 1234
      hid_feature: 48
      num_tfmamba: 4
      d_state: 16
      d_conv: 4
      expand: 2
      norm_epsilon: 1.0e-05
      input_channel: 2
      output_channel: 1
      n_fft: 400
      scan_backend: fused
      hop: 100
      win: 400
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: voicebank.snr_shift.semambapp@1
      snapshot_root: data/db/snapshots-snr-shift-v1-perrank
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs: {}
    inject:
      source:
        ref: source
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 1234
    inject:
      source:
        ref: source
      protocol:
        ref: protocol
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 4
      group_size: 2
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: true
      load_workers: 1
      require_profile: leakage_safe
    inject:
      source:
        ref: source
      sampler:
        ref: sampler
      protocol:
        ref: protocol
      batcher:
        ref: batcher
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0002
      betas:
      - 0.8
      - 0.99
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of:
    - mrd
    - cqt
    kwargs:
      lr: 0.0002
      betas:
      - 0.8
      - 0.99
      weight_decay: 0.01
  scheduler_g:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer:
        ref: optim_g
  scheduler_d:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer:
        ref: optim_d
  trainer:
    role: trainer
    class: src.experiments.official.semambapp.trainer.SEMambaPPTrainer
    kwargs:
      max_logical_steps: 133700
      accumulation: 2
      grad_clip: null
      validation_interval: 1337
      best_checkpoint_start_epoch: 40
      claim_label: leakage_safe_comparison
      max_epochs: 100
    inject:
      generator:
        ref: generator
      mrd:
        ref: mrd
      cqt:
        ref: cqt
      data:
        ref: data
      optim_g:
        ref: optim_g
      optim_d:
        ref: optim_d
      scheduler_g:
        ref: scheduler_g
      scheduler_d:
        ref: scheduler_d
  early_stop:
    role: stopping
    class: src.experiments.stopping.PatienceStopPolicy
    kwargs:
      metric: validation.pesq
      mode: max
      patience: 10
