# Phase 5 production candidate. Do not launch from this readiness session.
# ESPnet MS-SNSD recipe, fixed seed. Not a claim of the paper's unseeded run.
# World size 2, global batch 4, micro-batch 2, chunk 48,000, 35 epochs.
# 553,521 is the planned optimizer-update total. Epoch-end checkpoints remain.
# checkpoint_interval is 100 logical steps. Phase 5 estimated 4.0 s/update, so
# this is about 7 minutes plus the 2.7 s write. Validation stays at the epoch end.
# Launch with 2 visible GPUs. World size 1 is refused.
schema: audio-db-experiment/v1
seed: 0
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/tf-gridnet-ms-snsd
components:
  model:
    role: module
    class: src.experiments.official.tf_gridnet.model.TFGridNetModel
    kwargs:
      seed: 0
      variant: ms-snsd
      init: xavier_uniform
      architecture:
        n_fft: 512
        stride: 256
        n_layers: 4
        lstm_hidden_units: 128
        attn_n_head: 4
        attn_approx_qk_dim: 512
        emb_dim: 32
        emb_ks: 4
        emb_hs: 4
        activation: prelu
        eps: 1.0e-5
    prepare: {trainable: true, distribute: ddp}
  loss:
    role: loss
    class: src.experiments.losses.MultiResolutionL1Loss
    kwargs:
      windows: [256, 512, 768, 1024]
      time_domain_weight: 0.5
      normalize_variance: false
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: tf_gridnet.ms_snsd.espnet_recipe@1
      snapshot_root: data/db/snapshots
      split: train
  sampler:
    role: other
    class: src.experiments.data.ChunkSampler
    kwargs:
      seed: 0
      num_samples_per_epoch: 5000
      chunk_length: 48000
      shift_ratio: 0.5
      num_cache_chunks: 1024
      shuffle: true
      global_batch: 4
    inject:
      source: {ref: source}
  protocol:
    role: other
    class: src.experiments.data.ChunkProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 2
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optimizer:
    role: optimizer
    class: torch.optim.Adam
    parameters_of: model
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.0
  scheduler:
    role: scheduler
    class: torch.optim.lr_scheduler.ReduceLROnPlateau
    kwargs:
      mode: min
      factor: 0.7
      patience: 1
    inject:
      optimizer: {ref: optimizer}
  trainer:
    role: trainer
    class: src.experiments.official.tf_gridnet.trainer.TFGridNetTrainer
    kwargs:
      max_logical_steps: 553521
      accumulation: 1
      grad_clip: 5.0
      keep_nbest: 5
      max_epochs: 35
      early_stopping_patience: 5
      checkpoint_interval: 100
    inject:
      model: {ref: model}
      loss: {ref: loss}
      data: {ref: data}
      optimizer: {ref: optimizer}
      scheduler: {ref: scheduler}
