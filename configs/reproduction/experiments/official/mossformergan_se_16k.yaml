# Phase 5 production candidate. Do not launch from this readiness session.
# Official 2-GPU MossFormerGAN. micro-batch 1, accumulation 2, global batch 4.
# 11,572 utterances give 2,893 updates per pass. 121 passes are 350,053 updates.
# Scratch start: do not pass an initialization checkpoint.
# latest_every is 90 logical steps. Phase 5 estimated 5.3 s/update, so
# this is about 8 minutes plus the 3.6 s write. The plateau still runs at the pass end.
# Launch with 2 visible GPUs. World size 1 raises accumulation and is a different run.
schema: audio-db-experiment/v1
seed: 777
deterministic: false
entry: trainer
publication:
  algorithm: fixed_pair.mossformergan_se_16k
  claim_label: official_reproduction
  dataset_id: 18c0d64a78edc2914cc1ea71ea6558a0fa54d52f03252af843d49fc417c3c69c
  normalize: independent_audio_norm_v1
  profile: official_faithful
  protocol_id: 6a0fcf415f437d0e0a9b2a4f5cc5670645e48dc28536babd4fef860b99f00a33
  resample:
    tool: soxr
    quality: HQ
    source_rate: 48000
    target_rate: 16000
    length: source_frames_plus_one_div_3
    order:
      - read_float32
      - soxr_hq
      - protocol_normalize
      - protocol_window
  sample_rate: 16000
  selection_uses_test: true
  snapshot_hash: 8d9107b91fe36e11a76c5b6e686d29dcad16064a6c3de7598c82dd195e5056f5
  split: train
  teacher: dry_clean
  validation_crop: per_epoch_random
  validation_scope: per_rank
  window: 32000
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/mossformergan-se-16k-official-2gpu
checkpoint:
  selector:
    class: src.experiments.selectors.StandardSelector
    kwargs:
      latest_every: 90
components:
  generator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANGenerator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
      n_layers: 6
      n_head: 4
      approx_qk_dim: 512
      dense_depth: 4
      dropout: 0.1
      query_key_dim: 128
      expansion_factor: 4
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  discriminator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANDiscriminator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
      n_layers: 6
      n_head: 4
      approx_qk_dim: 512
      dense_depth: 4
      dropout: 0.1
      query_key_dim: 128
      expansion_factor: 4
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mossformergan.vb28.ondemand.official@1
      snapshot_root: data/db/snapshots-voicebank-float-v1
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs:
      normalize: independent_audio_norm_v1
      window: 32000
      sample_rate: 16000
      validation_crop: per_epoch_random
      resample:
        tool: soxr
        quality: HQ
        source_rate: 48000
        target_rate: 16000
        length: source_frames_plus_one_div_3
        order:
          - read_float32
          - soxr_hq
          - protocol_normalize
          - protocol_window
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 777
      validation_scope: per_rank
      order: rank_mod_fixed_v1
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 2
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: official_faithful
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.9, 0.999]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: discriminator
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.01
  ri_loss:
    role: loss
    class: src.experiments.losses.ContextTerm
    kwargs:
      name: ri
  magnitude_loss:
    role: loss
    class: src.experiments.losses.ContextTerm
    kwargs:
      name: magnitude
  time_loss:
    role: loss
    class: src.experiments.losses.ContextTerm
    kwargs:
      name: time
  gan_loss:
    role: loss
    class: src.experiments.losses.ContextTerm
    kwargs:
      name: gan
  generator_objective:
    role: loss
    class: src.experiments.losses.WeightedObjective
    kwargs:
      weights:
        ri: 0.1
        magnitude: 0.9
        time: 0.2
        gan: 0.05
    inject:
      terms:
        - {ref: ri_loss}
        - {ref: magnitude_loss}
        - {ref: time_loss}
        - {ref: gan_loss}
  discriminator_objective:
    role: loss
    class: src.experiments.losses.MossFormerDiscriminatorObjective
  trainer:
    role: trainer
    class: src.experiments.official.mossformergan.trainer.MossFormerGANTrainer
    kwargs:
      max_logical_steps: 350053
      accumulation: 2
      grad_clip: 10.0
      experiment_claim: official_faithful
      validate_on_epoch_end: true
    inject:
      generator: {ref: generator}
      discriminator: {ref: discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
      generator_objective: {ref: generator_objective}
      discriminator_objective: {ref: discriminator_objective}
