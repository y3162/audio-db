# Phase 5 production candidate. Do not launch from this readiness session.
# Official 2-GPU MossFormerGAN. micro-batch 1, accumulation 2, global batch 4.
# 11,572 utterances give 2,893 updates per pass. 121 passes are 350,053 updates.
# Scratch start: do not pass an initialization checkpoint.
# latest_every is 90 logical steps. Phase 5 estimated 5.3 s/update, so
# this is about 8 minutes plus the 3.6 s write. The plateau still runs at the pass end.
# Launch with 2 visible GPUs. World size 1 raises accumulation and is a different run.
schema: audio-db-experiment/v1
seed: 777
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/mossformergan-se-16k-official-2gpu
checkpoint:
  selector:
    class: src.experiments.selectors.StandardSelector
    kwargs:
      latest_every: 90
components:
  generator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANGenerator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  discriminator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANDiscriminator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mossformergan.vb28.ondemand.official@1
      snapshot_root: data/db/snapshots-voicebank-float-v1
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 777
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 2
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: official_faithful
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.9, 0.999]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: discriminator
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.01
  trainer:
    role: trainer
    class: src.experiments.official.mossformergan.trainer.MossFormerGANTrainer
    kwargs:
      max_logical_steps: 350053
      accumulation: 2
      grad_clip: 10.0
      experiment_claim: official_faithful
      validate_on_epoch_end: true
    inject:
      generator: {ref: generator}
      discriminator: {ref: discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
