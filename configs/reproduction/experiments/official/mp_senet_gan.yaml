# Phase 5 production candidate. Do not launch from this readiness session.
# Official-faithful MP-SENet, world size 2, micro-batch 2, global batch 4.
# 11,572 train utterances, 2,893 updates per epoch, 400 epochs, 1,157,200 updates.
# Validation uses the official test split. That score is not an independent test.
# latest_every is 210 logical steps, about 7.4 minutes at the Phase 5
# 2.1 s/update estimate. validation_interval stays 5000.
# Launch with 2 visible GPUs. World size 1 is a different condition.
schema: audio-db-experiment/v1
seed: 1234
deterministic: false
entry: trainer
publication:
  algorithm: fixed_pair.mp_senet
  claim_label: official_reproduction
  dataset_id: 2e1ebda5109626e04198b8dd16c1948cd2bde159087a16001fa9239c2860c67f
  normalize: noisy_rms_unit_v1
  profile: official_faithful
  protocol_id: 4d3e13e34a7c6beaa8406bee8ae006951aa12a8f88791f8ca29c6ce57a9bf6ae
  resample:
    tool: soxr
    quality: HQ
    source_rate: 48000
    target_rate: 16000
    length: source_frames_plus_one_div_3
    order:
      - read_float32
      - soxr_hq
      - protocol_normalize
      - protocol_window
  sample_rate: 16000
  selection_uses_test: true
  snapshot_hash: 9f342b0fccf5a021971d918a14821b8c18a05ea7de05d97086f9785dbaa413dc
  split: train
  teacher: dry_clean
  validation_crop: full_length
  validation_scope: rank0
  window: 32000
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/mp-senet-gan-official
checkpoint:
  selector:
    class: src.experiments.selectors.StandardSelector
    kwargs:
      latest_every: 210
components:
  generator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetGANGenerator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
      n_heads: 4
      dense_depth: 4
      ts_dropout: 0.0
      disc_dim: 16
    prepare: {trainable: true, distribute: ddp}
  metric_discriminator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetMetricDiscriminator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
      n_heads: 4
      dense_depth: 4
      ts_dropout: 0.0
      disc_dim: 16
    prepare: {trainable: true, distribute: ddp}
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mp_senet.vb28.ondemand.official@1
      snapshot_root: data/db/snapshots-voicebank-float-v1
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs:
      normalize: noisy_rms_unit_v1
      window: 32000
      sample_rate: 16000
      validation_crop: full_length
      resample:
        tool: soxr
        quality: HQ
        source_rate: 48000
        target_rate: 16000
        length: source_frames_plus_one_div_3
        order:
          - read_float32
          - soxr_hq
          - protocol_normalize
          - protocol_window
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 1234
      validation_scope: rank0
      order:
        - fixed_single_shuffle_v1
        - torch_distributed_sampler_v1
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 2
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: official_faithful
      prefetch: true
      load_workers: 1
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: metric_discriminator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  scheduler_g:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_g}
  scheduler_d:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_d}
  magnitude_loss:
    role: loss
    class: src.experiments.losses.MagnitudeMSE
    kwargs:
      name: magnitude
      estimate: generated_mag
      target: clean_mag
  phase_loss:
    role: loss
    class: src.experiments.losses.PhaseLoss
    kwargs:
      name: phase
      mode: diff
  complex_loss:
    role: loss
    class: src.experiments.losses.ScaledComplexMSE
    kwargs:
      name: complex
      scale: 2.0
      estimate: generated_complex
      target: clean_complex
  consistency_loss:
    role: loss
    class: src.experiments.losses.ScaledComplexMSE
    kwargs:
      name: consistency
      scale: 2.0
      estimate: recomputed_complex
      target: generated_complex
  time_loss:
    role: loss
    class: src.experiments.losses.TimeL1
    kwargs:
      name: time
      estimate: generated_audio
      target: clean_audio
  metric_loss:
    role: loss
    class: src.experiments.losses.MetricMSE
    kwargs:
      name: metric
  signal_objective:
    role: loss
    class: src.experiments.losses.WeightedObjective
    kwargs:
      weights:
        magnitude: 0.9
        phase: 0.3
        complex: 0.1
        consistency: 0.1
        time: 0.2
    inject:
      terms:
        - {ref: magnitude_loss}
        - {ref: phase_loss}
        - {ref: complex_loss}
        - {ref: consistency_loss}
        - {ref: time_loss}
  metric_objective:
    role: loss
    class: src.experiments.losses.WeightedObjective
    kwargs:
      weights:
        metric: 0.05
    inject:
      terms:
        - {ref: metric_loss}
  discriminator_objective:
    role: loss
    class: src.experiments.losses.MPSENetDiscriminatorObjective
  trainer:
    role: trainer
    class: src.experiments.official.mp_senet.trainer.MPSENetGANTrainer
    kwargs:
      max_logical_steps: 1157200
      accumulation: 1
      experiment_claim: official_faithful
      validation_interval: 5000
      best_checkpoint_start_epoch: 40
    inject:
      generator: {ref: generator}
      discriminator: {ref: metric_discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
      scheduler_g: {ref: scheduler_g}
      scheduler_d: {ref: scheduler_d}
      signal_objective: {ref: signal_objective}
      metric_objective: {ref: metric_objective}
      discriminator_objective: {ref: discriminator_objective}
