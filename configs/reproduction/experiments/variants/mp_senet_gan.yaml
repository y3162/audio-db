# Phase 5 production candidate for leakage-safe comparison. Do not launch here.
# Same GAN as the official profile. Snapshot is mp_senet.vb28.ondemand.safe@1.
# Train is 10,700 utterances, 2,675 updates per epoch, 400 epochs, 1,070,000 updates.
# Validation is p286/p287. Test is not a selection split.
# latest_every is 210 logical steps. validation_interval stays 2675.
# Launch with 2 visible GPUs.
schema: audio-db-experiment/v1
seed: 1234
deterministic: false
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cuda
    precision: fp32
output:
  directory: data/results/experiments/phase5-production/mp-senet-gan-leakage-safe
checkpoint:
  selector:
    class: src.experiments.selectors.StandardSelector
    kwargs:
      latest_every: 210
components:
  generator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetGANGenerator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
    prepare: {trainable: true, distribute: ddp}
  metric_discriminator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetMetricDiscriminator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
    prepare: {trainable: true, distribute: ddp}
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mp_senet.vb28.ondemand.safe@1
      snapshot_root: data/db/snapshots
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 1234
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 2
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: leakage_safe
      prefetch: true
      load_workers: 1
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: metric_discriminator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  scheduler_g:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_g}
  scheduler_d:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_d}
  trainer:
    role: trainer
    class: src.experiments.official.mp_senet.trainer.MPSENetGANTrainer
    kwargs:
      max_logical_steps: 1070000
      accumulation: 1
      experiment_claim: leakage_safe
      validation_interval: 2675
      best_checkpoint_start_epoch: 40
    inject:
      generator: {ref: generator}
      discriminator: {ref: metric_discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
      scheduler_g: {ref: scheduler_g}
      scheduler_d: {ref: scheduler_d}
