# Phase 4-A minimal MP-SENet connection.
# Waveform L1 only. This is not the official GAN objective.
# The model block is the small legal config used by the CPU connection test.
# The snapshot selector is the existing leakage-safe VoiceBank snapshot.
# Acceptance runs use a synthetic snapshot of the same protocol and do not
# execute this file against that VoiceBank snapshot.
schema: audio-db-experiment/v1
seed: 17
deterministic: true
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cpu
    precision: fp32
output:
  directory: runs/mp-senet-l1
components:
  model:
    role: module
    class: src.experiments.official.mp_senet.waveform.MPSENetWaveformAdapter
    kwargs:
      dense_channel: 4
      num_tsconformers: 1
      n_fft: 32
      hop_size: 8
      win_size: 32
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
    prepare: {trainable: true, distribute: none}
  loss:
    role: loss
    class: torch.nn.L1Loss
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mp_senet.vb28.ondemand.safe@1
      snapshot_root: data/db/snapshots-voicebank-float-v1
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs:
      normalize: noisy_rms_unit_v1
      window: 32000
      sample_rate: 16000
      validation_crop: full_length
      resample:
        tool: soxr
        quality: HQ
        source_rate: 48000
        target_rate: 16000
        length: source_frames_plus_one_div_3
        order:
          - read_float32
          - soxr_hq
          - protocol_normalize
          - protocol_window
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 17
      validation_scope: rank0
      order:
        - fixed_single_shuffle_v1
        - torch_distributed_sampler_v1
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: leakage_safe
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optimizer:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: model
    kwargs:
      lr: 0.001
      weight_decay: 0.0
  trainer:
    role: trainer
    class: src.experiments.trainers.StandardTrainer
    kwargs:
      max_logical_steps: 1
      accumulation: 1
    inject:
      model: {ref: model}
      loss: {ref: loss}
      data: {ref: data}
      optimizer: {ref: optimizer}
