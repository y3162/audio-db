# Phase 4-D MP-SENet official GAN declaration.
# This is the official-faithful algorithm, not a full VoiceBank run.
# max_logical_steps is 1, so an epoch does not finish and validation does not run.
# Leakage-safe is a different experiment: profile leakage_safe, selection_uses_test
# false, and validation_interval 2675 on mp_senet.vb28.ondemand.safe@1.
# Do not read those two profiles as one condition.
# The reproduction YAML keeps deterministic false for the long CUDA run.
# This file is the CPU algorithm declaration.
schema: audio-db-experiment/v1
seed: 1234
deterministic: true
entry: trainer
publication:
  algorithm: fixed_pair.mp_senet
  claim_label: official_reproduction
  dataset_id: 2e1ebda5109626e04198b8dd16c1948cd2bde159087a16001fa9239c2860c67f
  normalize: noisy_rms_unit_v1
  profile: official_faithful
  protocol_id: 4d3e13e34a7c6beaa8406bee8ae006951aa12a8f88791f8ca29c6ce57a9bf6ae
  resample:
    tool: soxr
    quality: HQ
    source_rate: 48000
    target_rate: 16000
    length: source_frames_plus_one_div_3
    order:
      - read_float32
      - soxr_hq
      - protocol_normalize
      - protocol_window
  sample_rate: 16000
  selection_uses_test: true
  snapshot_hash: 9f342b0fccf5a021971d918a14821b8c18a05ea7de05d97086f9785dbaa413dc
  split: train
  teacher: dry_clean
  validation_crop: full_length
  validation_scope: rank0
  window: 32000
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cpu
    precision: fp32
output:
  directory: runs/mp-senet-gan
checkpoint:
  selector:
    class: tests.experiments.support.StepArchiveSelector
    kwargs:
      interval: 5000
components:
  generator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetGANGenerator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
    prepare: {trainable: true, distribute: none}
  metric_discriminator:
    role: module
    class: src.experiments.official.mp_senet.models.MPSENetMetricDiscriminator
    kwargs:
      seed: 1234
      dense_channel: 64
      num_tsconformers: 4
      n_fft: 400
      hop_size: 100
      win_size: 400
      compress_factor: 0.3
      beta: 2.0
      sampling_rate: 16000
    prepare: {trainable: true, distribute: none}
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mp_senet.vb28.ondemand.official@1
      snapshot_root: data/db/snapshots-voicebank-float-v1
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs:
      normalize: noisy_rms_unit_v1
      window: 32000
      sample_rate: 16000
      validation_crop: full_length
      resample:
        tool: soxr
        quality: HQ
        source_rate: 48000
        target_rate: 16000
        length: source_frames_plus_one_div_3
        order:
          - read_float32
          - soxr_hq
          - protocol_normalize
          - protocol_window
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 1234
      validation_scope: rank0
      order:
        - fixed_single_shuffle_v1
        - torch_distributed_sampler_v1
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 1
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: official_faithful
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: metric_discriminator
    kwargs:
      lr: 0.0005
      betas: [0.8, 0.99]
      weight_decay: 0.01
  scheduler_g:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_g}
  scheduler_d:
    role: scheduler
    class: torch.optim.lr_scheduler.ExponentialLR
    kwargs:
      gamma: 0.99
    inject:
      optimizer: {ref: optim_d}
  trainer:
    role: trainer
    class: src.experiments.official.mp_senet.trainer.MPSENetGANTrainer
    kwargs:
      max_logical_steps: 1
      accumulation: 1
      experiment_claim: official_faithful
      validation_interval: 5000
      best_checkpoint_start_epoch: 40
    inject:
      generator: {ref: generator}
      discriminator: {ref: metric_discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
      scheduler_g: {ref: scheduler_g}
      scheduler_d: {ref: scheduler_d}
