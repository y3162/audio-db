# Phase 4-E MossFormerGAN official GAN declaration.
# This is the official-faithful se_16k algorithm, not a full VoiceBank run.
# max_logical_steps is 1, so an epoch does not finish and validation does not run.
# Official 1-GPU training uses micro-batch 1 and accumulation 2.
# The reproduction YAML keeps deterministic false for the long CUDA run.
# This file is the CPU algorithm declaration.
# Do not start that long run from this file.
schema: audio-db-experiment/v1
seed: 777
deterministic: true
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cpu
    precision: fp32
output:
  directory: runs/mossformergan-se-16k
components:
  generator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANGenerator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  discriminator:
    role: module
    class: src.experiments.official.mossformergan.models.MossFormerGANDiscriminator
    kwargs:
      seed: 777
      variant: se_16k
      n_fft: 400
      win_len: 400
      hop: 100
      num_channel: 64
      sampling_rate: 16000
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
      broadcast_buffers: true
      sync_batchnorm: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: mossformergan.vb28.ondemand.official@1
      snapshot_root: data/db/snapshots
      split: train
  protocol:
    role: other
    class: src.experiments.data.FixedPairProtocol
    kwargs: {}
    inject:
      source: {ref: source}
  sampler:
    role: other
    class: src.experiments.data.OrderSampler
    kwargs:
      seed: 777
    inject:
      source: {ref: source}
      protocol: {ref: protocol}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 1
      group_size: 2
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      require_profile: official_faithful
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optim_g:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: generator
    kwargs:
      lr: 0.0005
      betas: [0.9, 0.999]
      weight_decay: 0.01
  optim_d:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: discriminator
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.01
  trainer:
    role: trainer
    class: src.experiments.official.mossformergan.trainer.MossFormerGANTrainer
    kwargs:
      max_logical_steps: 1
      accumulation: 2
      grad_clip: 10.0
      experiment_claim: official_faithful
      checkpoint_interval: 5786
      validate_on_epoch_end: true
    inject:
      generator: {ref: generator}
      discriminator: {ref: discriminator}
      data: {ref: data}
      optim_g: {ref: optim_g}
      optim_d: {ref: optim_d}
