# Phase 4-G DeepFilterNet3. Official DfNet, AdamW, and the shipped cosine.
# The snapshot is dfn3.online.smoke@1, a ready substitute. dfn3.online.official@1
# stays blocked. max_logical_steps is 1, so this file does not train the
# 120-epoch schedule and does not claim a paper score.
# global_batch 16 is epoch 0 of the shipped batch schedule. World size 1 is
# required: the schedule is refused for any other world size. World size 1
# does not wrap DDP. find_unused_parameters stays on because df_fc_a is unused.
schema: audio-db-experiment/v1
seed: 7
deterministic: true
entry: trainer
runtime:
  class: src.experiments.runtime.ProcessRuntime
  kwargs:
    device: cpu
    precision: fp32
output:
  directory: runs/deepfilternet3
checkpoint:
  selector:
    class: tests.experiments.support.StepArchiveSelector
    kwargs:
      interval: 1
components:
  model:
    role: module
    class: src.experiments.official.deepfilternet3.model.DeepFilterNet3Model
    kwargs:
      seed: 7
      variant: deepfilternet3
      architecture:
        sr: 48000
        fft_size: 960
        hop_size: 480
        nb_erb: 32
        nb_df: 96
        norm_tau: 1.0
        lsnr_max: 35
        lsnr_min: -15
        min_nb_freqs: 2
        df_order: 5
        df_lookahead: 2
        conv_lookahead: 2
        conv_ch: 64
        emb_hidden_dim: 256
        emb_num_layers: 3
        enc_lin_groups: 32
        lin_groups: 16
        df_hidden_dim: 256
        df_num_layers: 2
        df_gru_skip: groupedlinear
        df_pathway_kernel_size_t: 5
        enc_concat: false
        conv_kernel: [1, 3]
        convt_kernel: [1, 3]
        conv_kernel_inp: [3, 3]
        df_n_iter: 1
        mask_pf: false
        pf_beta: 0.02
    prepare:
      trainable: true
      distribute: ddp
      find_unused_parameters: true
  source:
    role: other
    class: src.experiments.data.SnapshotSource
    kwargs:
      snapshot: dfn3.online.smoke@1
      snapshot_root: data/db/snapshots
      split: train
  sampler:
    role: other
    class: src.experiments.data.Dfn3IndexSampler
    kwargs:
      seed: 7
      global_batch: 16
      validation_batch: 64
      validation_scope: rank0
    inject:
      source: {ref: source}
  protocol:
    role: other
    class: src.experiments.data.Dfn3Protocol
    kwargs:
      sample_rate: 48000
      window: 144000
    inject:
      source: {ref: source}
  batcher:
    role: other
    class: src.experiments.data.MicroBatcher
    kwargs:
      micro_batch: 16
      group_size: 1
      keep_partial: true
  data:
    role: data
    class: src.experiments.data.SnapshotDataModule
    kwargs:
      prefetch: false
    inject:
      source: {ref: source}
      sampler: {ref: sampler}
      protocol: {ref: protocol}
      batcher: {ref: batcher}
  optimizer:
    role: optimizer
    class: torch.optim.AdamW
    parameters_of: model
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 1.0e-12
      amsgrad: true
  spectral_loss:
    role: loss
    class: src.experiments.official.deepfilternet3.losses.DeepFilterNetSpectralLoss
    kwargs:
      name: spectral
      factor: 500.0
      complex_factor: 500.0
      gamma: 0.3
      fft_sizes: [256, 512, 1024, 2048]
      magnitude_floor: 1.0e-12
  local_snr_loss:
    role: loss
    class: src.experiments.official.deepfilternet3.losses.LocalSNRLoss
    kwargs:
      name: local_snr
      milliseconds: 20
      energy_floor: 1.0e-12
  objective:
    role: loss
    class: src.experiments.losses.WeightedObjective
    kwargs:
      weights:
        spectral: 1.0
        local_snr: 0.001
    inject:
      terms:
        - {ref: spectral_loss}
        - {ref: local_snr_loss}
  trainer:
    role: trainer
    class: src.experiments.official.deepfilternet3.trainer.DeepFilterNet3Trainer
    kwargs:
      max_logical_steps: 1
      accumulation: 1
      grad_clip: 1.0
      max_epochs: 120
      early_stopping_patience: 25
      steps_per_epoch: 1
      epochs: 120
      lr_min: 1.0e-6
      lr_warmup: 1.0e-4
      warmup_epochs: 3
      weight_decay_end: 0.01
      batch_size_limit: 64
      batch_schedule:
        - [0, 16]
        - [2, 24]
        - [5, 32]
        - [10, 64]
        - [20, 128]
        - [40, 9999]
    inject:
      model: {ref: model}
      data: {ref: data}
      optimizer: {ref: optimizer}
      objective: {ref: objective}
