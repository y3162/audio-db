# Not read automatically. scripts/setup/compile_locks.sh passes these indexes.
# unsafe-best-match is required so the cu124 torch build is visible beside PyPI.
index-url = "https://download.pytorch.org/whl/cu124"
extra-index-url = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"
python-version = "3.12"
